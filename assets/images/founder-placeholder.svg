<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1E36"/>
      <stop offset="60%" stop-color="#06101E"/>
      <stop offset="100%" stop-color="#040A14"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#E2B13C"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="750" fill="url(#bgGrad)"/>

  <!-- Subtle Geometric Grid Background -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
    <line x1="150" y1="0" x2="150" y2="750"/>
    <line x1="300" y1="0" x2="300" y2="750"/>
    <line x1="450" y1="0" x2="450" y2="750"/>
  </g>

  <!-- Executive Silhouette Representation -->
  <g fill="#1E2F47" opacity="0.6">
    <!-- Head -->
    <circle cx="300" cy="280" r="90" fill="#2A4365"/>
    <!-- Shoulders / Suit -->
    <path d="M 120,600 C 120,440 200,400 300,400 C 400,400 480,440 480,600 L 480,750 L 120,750 Z" fill="#1A2B42"/>
    <!-- Tie Accent -->
    <polygon points="285,420 315,420 308,580 300,600 292,580" fill="url(#goldAccent)" opacity="0.7"/>
  </g>

  <!-- Outer Framing -->
  <rect x="20" y="20" width="560" height="710" rx="16" fill="none" stroke="url(#goldAccent)" stroke-width="2" opacity="0.3"/>

  <!-- Placeholder Information Overlay Badge -->
  <rect x="50" y="600" width="500" height="100" rx="12" fill="#0E1E36" stroke="#1E2F47" stroke-width="1.5"/>
  <text x="75" y="635" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#C59B27" letter-spacing="2">FOUNDER &amp; PRACTICE LEAD</text>
  <text x="75" y="665" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Muhammad Obaid Yar Khan Afridi</text>
  <text x="75" y="685" font-family="'Inter', sans-serif" font-size="12" font-weight="400" fill="#94A3B8">20+ Years Executive Leadership | Riyadh, Saudi Arabia</text>
</svg>
